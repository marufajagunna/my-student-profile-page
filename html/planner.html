<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Academic Planner | Ajagunna Marufdeen Biodun</title>
    <meta name="description" content="Interactive academic planner for Ajagunna Marufdeen Biodun, a Cybersecurity student." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/styles.css" />
  </head>
  <body data-page="planner">
    <header class="site-header">
      <div class="container nav-wrap">
        <a href="index.html" class="brand">Ajagunna Marufdeen Biodun</a>
        <button class="nav-toggle" aria-label="Open menu">☰</button>
        <nav class="site-nav" aria-label="Main navigation">
          <a href="index.html">Home</a>
          <a href="about.html">About</a>
          <a href="projects.html">Projects</a>
          <a href="planner.html" class="active">Planner</a>
          <a href="contact.html">Contact</a>
        </nav>
      </div>
    </header>

    <main>
      <section class="page-banner">
        <div class="container">
          <p class="eyebrow">Academic Planner</p>
          <h1>Stay organized and on track</h1>
        </div>
      </section>

      <section class="section">
        <div class="container planner-layout">
          <div class="planner-card">
            <h2>Add a task</h2>
            <form id="taskForm" class="task-form">
              <label for="taskInput" class="sr-only">Task description</label>
              <input id="taskInput" type="text" placeholder="Enter a task or deadline" />
              <button type="submit" class="btn btn-primary">Add Task</button>
            </form>
            <div class="task-summary">
              <div>
                <span id="pendingCount">0</span>
                <small>Pending</small>
              </div>
              <div>
                <span id="completedCount">0</span>
                <small>Completed</small>
              </div>
            </div>
          </div>

          <div class="planner-card">
            <h2>Upcoming tasks</h2>
            <ul id="taskList" class="task-list" aria-live="polite"></ul>
          </div>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container footer-wrap">
        <p>© Copyright <span id="year"></span> MIVA Open University All Rights Reserved</p>
      </div>
    </footer>

    <script src="../js/script.js"></script>
  </body>
</html>
